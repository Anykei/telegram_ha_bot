name: Release and Update Store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release transaction across all entry points. Never cancel a publishing job.
concurrency:
  group: release-production
  cancel-in-progress: false

env:
  STORE_REPO: Anykei/ha_addons
  CONFIG_PATH: telegram_bot_addon/config.yaml
  CHANGELOG_PATH: telegram_bot_addon/CHANGELOG.md

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
    with:
      rust-toolchain: '1.99.1'
      build-docker: true

  release:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject superseded runs and refresh tags
        run: |
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo 'main has moved; run the release from its latest commit.' >&2
            exit 1
          }
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Plan version (read-only, retry-safe)
        id: version
        run: python3 scripts/release.py plan --github-output

      # Fail early if the store credential/config is unavailable, before publishing.
      - name: Checkout Addons Store
        uses: actions/checkout@v4
        with:
          repository: ${{ env.STORE_REPO }}
          ref: main
          token: ${{ secrets.PAT_TOKEN }}
          path: store_repo

      - name: Validate store version, image and release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release.py store --path "store_repo/$CONFIG_PATH" --version "$RELEASE_VERSION" --image "$IMAGE" --config-source ha-addon/config.yaml --changelog ha-addon/CHANGELOG.md --check

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect existing version (never overwrite a different release)
        id: existing
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" --raw > "$RUNNER_TEMP/image.json" 2> "$RUNNER_TEMP/image-error.txt"; then
            python3 scripts/release.py verify-image --path "$RUNNER_TEMP/image.json" --version "$RELEASE_VERSION" --sha "$GITHUB_SHA"
            echo 'found=true' >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest unknown|not found' "$RUNNER_TEMP/image-error.txt"; then
            echo 'found=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/image-error.txt" >&2
            exit 1
          fi

      - name: Stamp binary version in the release checkout
        if: steps.existing.outputs.found != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release.py stamp --version "$RELEASE_VERSION"

      - name: Build and push immutable version
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          outputs: type=registry,oci-mediatypes=true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          annotations: |
            index:org.opencontainers.image.version=${{ steps.version.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=bot-release
            type=gha,scope=bot-amd64
          cache-to: type=gha,scope=bot-release,mode=max
          provenance: false

      - name: Verify image before promoting the release
        id: image
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" --raw > "$RUNNER_TEMP/image.json"
          python3 scripts/release.py verify-image --path "$RUNNER_TEMP/image.json" --version "$RELEASE_VERSION" --sha "$GITHUB_SHA"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" --format '{{.Manifest.Digest}}')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify both runtime binaries without HA or Telegram
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            test "$(docker run --rm --network none --platform "$platform" "$IMAGE:$RELEASE_VERSION" --version)" = "telegram_ha_bot $RELEASE_VERSION"
          done

      # Save the version before the cross-repo update. A failed store push can
      # then be retried on this same SHA without another bump or image overwrite.
      - name: Record source tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Update Addons Store without downgrading
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git -C store_repo config user.name 'github-actions[bot]'
          git -C store_repo config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # This is an ephemeral checkout owned by this job; retry concurrent
            # store updates from the fresh branch, without force-pushing.
            git -C store_repo fetch origin main
            git -C store_repo reset --hard origin/main
            python3 scripts/release.py store --path "store_repo/$CONFIG_PATH" --version "$RELEASE_VERSION" --image "$IMAGE" --config-source ha-addon/config.yaml --changelog ha-addon/CHANGELOG.md
            git -C store_repo add "$CONFIG_PATH" "$CHANGELOG_PATH"
            if git -C store_repo diff --cached --quiet; then
              exit 0
            fi
            git -C store_repo commit -m "Update Telegram Bot to $RELEASE_VERSION"
            if git -C store_repo push origin HEAD:main; then
              exit 0
            fi
            echo "Store push attempt $attempt failed; refreshing its branch." >&2
          done
          exit 1

      - name: Promote latest after the store update
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$IMAGE_DIGEST"
