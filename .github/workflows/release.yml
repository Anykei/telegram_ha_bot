name: Release and Update Store

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  STORE_REPO: "Anykei/ha_addons"
  CONFIG_PATH: "telegram_bot_addon/config.yaml"
  RUST_TOOLCHAIN: 1.87.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bot Code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            clang \
            libclang-dev \
            libssl-dev \
            libsqlite3-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libpostproc-dev \
            libswscale-dev \
            libswresample-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add rustfmt --toolchain "$RUST_TOOLCHAIN"
          rustup component add clippy --toolchain "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Check project
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Bot Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lowercase repo owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # 1. Генерируем новую версию БЕЗ префикса "v"
      - name: Bump version (Dry Run)
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true
          tag_prefix: "" # Убираем букву "v" из тега

      - name: Ensure release version exists
        run: |
          test -n "${{ steps.tag_version.outputs.new_tag }}"
          test "${{ steps.tag_version.outputs.new_tag }}" != "undefined"

      # 2. Настройка Docker
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Сборка и Пуш образа (тег будет чистым числом, например 0.0.6)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/telegram_ha_bot:${{ steps.tag_version.outputs.new_tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/telegram_ha_bot:latest
          provenance: false

      - name: Checkout Addons Store
        uses: actions/checkout@v4
        with:
          repository: ${{ env.STORE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          path: store_repo

      # 4. Обновление версии в репозитории Магазина
      - name: Update Version in Addons Store
        run: |
          cd store_repo

          NEW_VER="${{ steps.tag_version.outputs.new_tag }}"

          # Обновляем версию в config.yaml
          sed -i "s/^version: .*/version: \"$NEW_VER\"/" ${{ env.CONFIG_PATH }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.CONFIG_PATH }}

          if git diff --cached --quiet; then
            echo "Addon store already points to $NEW_VER"
            exit 0
          fi

          git commit -m "Update Telegram Bot to $NEW_VER"

          # Пушим обратно в main
          git push origin main

      # 5. Финальный шаг: фиксируем тег в репозитории БОТА
      - name: Push Git Tag to Bot Repo
        if: success()
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.tag_version.outputs.new_version }}
          tag_prefix: ""
