name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.87.0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bot Code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            clang \
            libclang-dev \
            libssl-dev \
            libsqlite3-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libpostproc-dev \
            libswscale-dev \
            libswresample-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Check project
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked
