[package]
name = "telegram_ha_bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tokio-util = "0.7"
anyhow = "1.0"
teloxide = { version = "0.17.0", features = ["macros", "ctrlc_handler"] }
log = "0.4"
pretty_env_logger = "0.5"
dotenvy = "0.15"
serde_json = "1.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
urlencoding = "2.1.3"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "sqlite", "chrono", "macros"] }
futures-util = "0.3.34"
tungstenite = "0.30.0"
plotters = { version = "0.3.7", features = ["ttf", "bitmap_backend", "chrono"] }
image = "0.25.10"
ffmpeg-next = "9.0.0"
dashmap = "6.2.1"
async-trait = "0.1.92"
postcard = { version = "1.1", features = ["alloc"] }
base64 = "0.23"
strsim = "0.11.1"

[profile.release]
opt-level = 'z'     # Оптимизация по размеру
lto = true          # Link Time Optimization (удаляет неиспользуемый код)
codegen-units = 1   # Позволяет LTO работать лучше
panic = 'abort'     # Удаляет развертывание стека (уменьшает размер)
strip = true        # Автоматически удаляет отладочную информацию

# Remove when upstream publishes the public proc_macro re-export fix.
[patch.crates-io]
proc-macro-error2 = { path = "vendor/proc-macro-error2" }
